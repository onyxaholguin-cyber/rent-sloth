name: test
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 --version && python3 -m unittest discover -s tests -v
      - name: recorded Gemma 4 runs place every payment correctly with zero unflagged errors
        run: python3 eval/score.py tests/fixtures/gemma-4-E2B-it-Q4_0 && python3 eval/score.py tests/fixtures/holdout-gemma-4-E2B-it-Q4_0 samples/holdout
